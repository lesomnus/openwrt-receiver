on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test.yaml"
      - "openwrtreceiver/**"
  pull_request:
    paths:
      - ".github/workflows/test.yaml"
      - "openwrtreceiver/**"

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: openwrtreceiver
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: openwrtreceiver/go.mod
          cache-dependency-path: openwrtreceiver/go.sum
      - run: go vet ./...
      - run: go test -v -race ./...
